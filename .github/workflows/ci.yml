# Checks on every push and pull request. Nothing is deployed or published.
# The same checks run locally with: bash scripts/local/test.sh
# Tests that need git-ignored evidence (analysis runs, peer PDFs, job postings) skip with a reason here
# (backend/tests/data_requirements.py) and run in full on a machine that has the evidence.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check backend scripts

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]   # oldest supported and the version on the development Mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: System tools (PDF text layer)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Tests with coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term:skip-covered --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: backend/coverage.xml

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /app/
